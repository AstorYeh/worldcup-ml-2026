# 2026 世界盃賠率每日自動更新器
# 用法：
#   1. 複製 .env.example 為 .env 並填入 ODDS_API_KEY 與 GITHUB_TOKEN
#   2. docker compose up -d --build
#   3. docker compose logs -f   # 看每日更新狀態
services:
  odds-updater:
    build: .
    container_name: worldcup-odds-updater
    restart: unless-stopped
    environment:
      # The Odds API 金鑰（https://the-odds-api.com 免費月 500 次）
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      # GitHub PAT（需 repo push 權限；用於推送 market_odds.py）
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-AstorYeh/worldcup-ml-2026}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      # 每天觸發時刻（UTC 小時；2 = 台灣 10:00）
      TARGET_HOUR: ${TARGET_HOUR:-2}
      REPO_DIR: /repo
    volumes:
      # 把專案 repo 掛進容器（預設指向上兩層 = 專案根目錄）
      - ../../:/repo
